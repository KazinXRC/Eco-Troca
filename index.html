<!DOCTYPE html>
<html lang="pt-BR">
<link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoTroca - Sustentabilidade Escolar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <div class="header-container">
      <h1>🌱 EcoTroca</h1>
      <p>Reutilize, doei e ajude o planeta na sua escola!</p>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container">

    <!-- Formulário de Cadastro -->
    <section class="card-form">
      <h2>Cadastrar Item para Doação/Troca</h2>
      <form id="item-form">
        <div class="form-group">
          <label for="titulo">Nome do Item</label>
          <input type="text" id="titulo" placeholder="Ex: Livro de Biologia 1º Ano" required>
        </div>

        <div class="form-group">
          <label for="categoria">Categoria</label>
          <select id="categoria" required>
            <option value="">Selecione uma categoria</option>
            <option value="Livros e Didáticos">Livros e Didáticos</option>
            <option value="Material Escolar">Material Escolar</option>
            <option value="Eletrônicos">Eletrônicos</option>
            <option value="Outros">Outros</option>
          </select>
        </div>

        <div class="form-group">
          <label for="descricao">Descrição / Estado de Conservação</label>
          <textarea id="descricao" rows="3" placeholder="Descreva o estado do item e onde entregar na escola..." required></textarea>
        </div>

        <div class="form-group">
          <label for="contato">Seu Nome e Turma</label>
          <input type="text" id="contato" placeholder="Ex: Ana Silva (2º B)" required>
        </div>

        <button type="submit" class="btn-primary">Publicar Item</button>
      </form>
    </section>

    <!-- Filtro e Lista de Itens -->
    <section class="catalog">
      <div class="catalog-header">
        <h2>Itens Disponíveis</h2>
        <div class="filter-group">
          <select id="filter-categoria">
            <option value="TODAS">Todas as Categorias</option>
            <option value="Livros e Didáticos">Livros e Didáticos</option>
            <option value="Material Escolar">Material Escolar</option>
            <option value="Eletrônicos">Eletrônicos</option>
            <option value="Outros">Outros</option>
          </select>
        </div>
      </div>

      <!-- Feed dinâmico via JS -->
      <div id="items-grid" class="grid"></div>
    </section>

  </main>

  <footer>
    <p>Projeto EcoTroca • Feito para a Feira/Competição de Programação</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
